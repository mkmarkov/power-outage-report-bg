name: Publish outages feed

on:
  schedule:
    # Every 20 minutes, offset from :00 when GitHub's scheduler is busiest
    - cron: "7,27,47 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Poll every source regardless of its interval
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write # keepalive step below

concurrency:
  group: pages
  cancel-in-progress: false

env:
  FEED_URL: https://mkmarkov.github.io/power-outage-report-bg/outages.json

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt pytest

      - run: python -m pytest tests -q

      - name: Build feed
        run: >
          python -m publisher.build_feed --out site --previous-url "$FEED_URL"
          ${{ inputs.force && '--force' || '' }}

      # Pushes new outages to FCM place topics and marks them in the feed,
      # so it runs before the upload. Without the secret it marks only.
      - name: Push notifications
        id: notify
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: python -m publisher.notify --feed site/outages.json

      - name: Add static pages (privacy policy)
        run: cp -r static/. site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4

      # GitHub disables scheduled workflows after 60 days without repo
      # activity; re-enabling from inside the run resets that timer.
      - name: Keep schedule alive
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/publish.yml/enable"

      # Fails the run (and emails the repo owner) when a DSO keeps failing
      - name: Check source health
        if: always()
        run: python -m publisher.build_feed --check-health site/outages.json

      - name: Report push failures
        if: steps.notify.outcome == 'failure'
        run: |
          echo "::error::Push notifications failed; see the 'Push notifications' step log"
          exit 1
